<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · WearSahin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0d0d;--paper:#f3f1ea;--accent:#c8ff2e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7}
header{border-bottom:2px solid var(--ink);background:var(--paper)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.nav{display:flex;justify-content:space-between;align-items:center;height:66px}
.logo{font-family:'Anton',Impact,sans-serif;font-size:28px;text-decoration:none;color:var(--ink)}
.logo b{background:var(--accent);padding:0 6px;font-weight:400}
.back{font-weight:700;text-decoration:none;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-size:14px}
main{padding:56px 0 80px}
h1{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(40px,6vw,64px);line-height:1;text-transform:uppercase;margin-bottom:28px}
h2{font-size:22px;margin:32px 0 10px}
h3{font-size:18px;margin:24px 0 8px}
p,li{margin-bottom:12px;color:#2b2a27}
ul,ol{padding-left:22px}
a{color:var(--ink)}
footer{background:var(--ink);color:#bdbab1;padding:24px 0;font-size:14px}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="logo" href="../index.html">WEAR<b>SAHİN</b></a><a class="back" href="../index.html">← Mağazaya dön</a></div></header>
<main class="wrap">
<h1>{{ page.title }}</h1>
{{ content }}
</main>
<footer><div class="wrap">© WearSahin</div></footer>
</body>
</html>
